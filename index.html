<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>New Year Wishes Wall 2082</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Background music -->
  <audio id="new -year-music" autoplay loop>
    <source src="new year.mp4" type="audio/mpeg">
  </audio>
 
  <!-- Fireworks animation -->
  <div class="fireworks"></div>

  <div class="container">
    <img src="group.jpg" alt="Group Photo" class="group-photo">

    <h1>🎊 New Year Wishes Wall - 2082 🎊</h1>

    <div class="input-box">
      <input type="text" id="wishInput" placeholder="Type your New Year wish..." />
      <button id="sendBtn">Send Wish</button>
    </div>

    <div id="wishesWall" class="wishes-wall">
      <!-- Wishes will appear here -->
    </div>

    <footer>
      Made by Samyak
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
